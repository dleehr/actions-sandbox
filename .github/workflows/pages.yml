# Mirrors ansible/handbook pages.yml: depth-1 checkout plus a targeted
# fetch of full history for refs/heads/main only, so the build's
# git-derived dates are correct without fetching other branches.
name: Deploy static content to Pages

permissions:
  contents: write

on:
  push:
    branches: ["main"]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The build derives last-modified dates from git history.
      # Fetch full history for main only; a fetch-depth of 0 would
      # also fetch every other branch.
      - name: Fetch full history for main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --unshallow origin +refs/heads/main:refs/remotes/origin/main

      - name: Build site
        run: |
          mkdir -p public
          {
            echo "<html><head><title>actions-sandbox</title></head><body>"
            echo "<h1>Git-derived last-modified dates</h1>"
            echo "<table border=\"1\">"
            for f in $(git ls-files 'content/*.md'); do
              printf '<tr><td>%s</td><td>%s</td></tr>\n' "$f" "$(git log -1 --format='%ci' -- "$f")"
            done
            echo "</table></body></html>"
          } > public/index.html
          cat public/index.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: public
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
